name: Rebuild profile outputs

on:
  push:
    branches: [main]
    paths: ["data/**", "scripts/**", "templates/**", "package.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Opzionali (Settings → Secrets and variables → Actions):
      CV_PHONE: ${{ secrets.CV_PHONE }}                       # numero di telefono solo nel CV, fuori dal JSON pubblico
      PROFILE_README_TOKEN: ${{ secrets.PROFILE_README_TOKEN }} # token per aggiornare il repo GoldStygian/GoldStygian
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Valida e genera sito, CV e testi
        run: npm run build

      - name: Commit dei file generati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html cv.pdf dist
          git diff --cached --quiet || (git commit -m "chore: rebuild profile outputs" && git push)

      - name: Aggiorna il README del profilo GitHub
        if: env.PROFILE_README_TOKEN != ''
        run: |
          git clone "https://x-access-token:${PROFILE_README_TOKEN}@github.com/GoldStygian/GoldStygian.git" /tmp/profile
          cp dist/README.profile.md /tmp/profile/README.md
          cd /tmp/profile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "chore: sync profile README" && git push)
